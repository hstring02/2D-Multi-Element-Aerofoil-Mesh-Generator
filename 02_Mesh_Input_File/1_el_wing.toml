title = "1_el_wing"

## Flow Data (Used to calculate first layer height and for post-processing)
[flow]
DENSITY = 1.225         # kg/m^3
VELOCITY = 13.5         # m/s
VISCOSITY = 1.81e-5     # Pa.s
REYNOLDS_LENGTH = 1.4   # m (based on the chord of the largest element in the mesh)
Y_PLUS = 1.0            # target y+ for the first layer of the boundary layer mesh

## Geometry (All in metres and degrees)
[foils]
ELEMENT = ['El_1']
AIRFOIL_FILE = ["NACA4415_Selig.dat"]
CHORD = [1.4]            
POSITION = [[0.0, 0.0]]   # El_1 is absolute (world coords); each element after is an offset from the previous element's trailing edge
AOA = [12.0]              
TE_THICKNESS = [0.0004]   

[farfield]   
XMIN = -10.0     
XMAX = 20.0     
YMIN = -10.0     
YMAX = 10.0      

## Mesh Parameters
[visualisation]
ENABLED = true

[global_refinement]
MESH_MAX = 5.0                  # far field
CELLS_PER_CHORD = 75            # each element's surface point spacing = its own CHORD / this, so all elements get proportionally equal resolution regardless of size
GROWTH_RATE = 1.3               # geometric ring-to-ring growth rate away from each airfoil
TE_CELLS = 5                    # number of mesh cells enforced across each blunt TE base
MAX_CURVATURE_ANGLE = 5.0      # degrees; max angle a curve (e.g. leading edge) subtends per mesh element
TE_FAN_ELEMENTS = 8             # inflation layer elements fanned around each blunt TE corner (Gmsh default; tune if corner cells still look skewed)

[boundary_layer]
ENABLED = true
GROWTH_RATE = 1.15               # layer-to-layer growth ratio
THICKNESS = 0.01               # total inflation layer thickness, metres

[wake_refinement]  
ENABLED = true                  # A refinement box is generated per aerofoil element
MESH_SIZE = 0.01                # metres; target cell size inside each wake box (between each element's own POINT_SIZE and MESH_MAX)
X_START_CHORDS = -0.1           # chords downstream of each element's TE where its wake box starts (small gap so it doesn't overlap the near-body/TE fields)
Y_HALF_HEIGHT_CHORDS = 0.1      # chords of padding above/below each element's own Y-extent (its footprint projected onto the y-axis, so higher-AOA elements already get a taller box before this padding is added)

[te_refinement]
ENABLED = true
MESH_SIZE = 0.0001              # metres; target cell size right at each TE corner (finer than each element's own POINT_SIZE)
DIST_MAX = 0.01                 # metres; distance from the TE corner over which size relaxes back to the surrounding background size (each element's own POINT_SIZE close to the airfoil)